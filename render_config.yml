# render_config.yml
# Google Timeline Visualizer - 렌더링 설정 파일
#
# 이 파일의 값이 기본값이 됩니다. CLI 플래그(--map, --fps 등)가 이 값을 덮어씁니다.
# 파일을 삭제하면 내장 기본값이 사용됩니다.
# API 키는 .env 파일에 저장하세요 (절대 커밋 금지).

# ── 지도 배경 타일 ────────────────────────────────────────────────────────────
map:
  # 타일 공급자 선택
  # 무료 (API 키 없음): osm | cartodb-voyager | cartodb-light | cartodb-dark
  # 무료 (회원가입 필요): stadia-dark | stadia-light
  # 프리미엄: mapbox
  # 사용자 정의 XYZ URL: custom (아래 custom_url 입력)
  provider: cartodb-voyager

  # provider: custom 일 때 XYZ 타일 URL ({z}/{x}/{y} 포함)
  custom_url: ""

  # API 키 (.env 파일의 값이 여기보다 우선합니다)
  mapbox_token: ""      # .env: MAPBOX_TOKEN=pk.eyJ1...
  stadia_api_key: ""    # .env: STADIA_API_KEY=...

# ── 출력 해상도 ───────────────────────────────────────────────────────────────
canvas:
  width:  1280              # 가로 픽셀 (권장: 1280 / 1920)
  height:  720              # 세로 픽셀 (권장: 720 / 1080)
  bbox_padding:      0.10   # 프레임 뷰포트 여백 비율 (10%)
  bbox_min_padding_deg: 0.005  # 최소 여백 (도)

  # (legacy) World Canvas — 타일 피라미드로 대체됨, 호환을 위해 남김
  scale: 3
  min_viewport_deg: 0.008   # 프레임 최소 뷰포트 (도) — 정지 시 과도한 줌인 방지

# ── 타일 피라미드 (다중 줌 적응형 배경) ─────────────────────────────────────
# 매 프레임 viewport 크기에 맞는 zoom 레벨의 XYZ 타일을 동적으로 합성.
# 줌인 시에도 항상 ≈1:1 픽셀 매핑이 보장되어 픽셀화 없음.
tiles:
  # 다운로드 가능한 최대 zoom (대부분의 공급자: 17~19)
  # 너무 높이면 일부 지역 타일 없음 → 회색 처리
  max_zoom: 17

  # 줌 오프셋 — ideal_zoom 계산값에 더해짐
  #   0  : 정확한 1:1 픽셀비 (권장)
  #   +1 : 한 단계 더 정밀 (타일 4배 많아짐, 디테일↑)
  #   -1 : 한 단계 덜 정밀 (빠름)
  zoom_offset: 0

  # 병렬 다운로드 워커 수 (네트워크 속도 + 공급자 rate limit 고려)
  prefetch_parallel: 8

  # 타일 캐시 디렉터리 (프로젝트 전역, 공급자별 자동 분리)
  cache_dir: "output/_tile_cache"

# ── 잔상(trail) 설정 ─────────────────────────────────────────────────────────
trail:
  length: 300            # 화면에 표시할 최대 이전 포인트 수
  alpha_min: 60          # 가장 오래된 포인트 투명도 (0~255)
  alpha_max: 255         # 현재 포인트 투명도
  current_point_scale: 2 # 현재 위치 점 크기 배율
  outline_color: [255, 255, 255]
  outline_alpha: 200
  outline_extra_radius: 3

  # 이동 경로 선 그리기 (포인트 간 연결선)
  draw_lines: true       # false → 점만 표시, 선 없음

# ── 교통수단별 점 색상 (RGB) ──────────────────────────────────────────────────
colors:
  stationary: [100, 100, 100]   # 회색       — 정지
  walking:    [ 34, 197,  94]   # 초록       — 도보
  running:    [ 16, 185, 129]   # 진한 초록  — 달리기
  cycling:    [ 59, 130, 246]   # 파랑       — 자전거
  car:        [249, 115,  22]   # 주황       — 자가용
  taxi:       [250, 204,  21]   # 노랑       — 택시
  bus:        [139,  92, 246]   # 보라       — 버스
  subway:     [236,  72, 153]   # 핫핑크     — 지하철
  train:      [220,  38,  38]   # 진한 빨강  — 기차
  highway:    [239,  68,  68]   # 빨강       — 고속도로
  flight:     [168,  85, 247]   # 보라       — 비행기

# ── 교통수단별 점 반경 (px, 기본 크기 기준) ───────────────────────────────────
radius:
  stationary: 2
  walking:    3
  running:    3
  cycling:    4
  car:        4
  taxi:       4
  bus:        5
  subway:     5
  train:      6
  highway:    5
  flight:     6

# ── 교통수단별 이동 경로 선 굵기 (px) ─────────────────────────────────────────
# 0 으로 설정 시 해당 교통수단의 선 미표시
line_width:
  stationary: 0   # 정지 구간은 선 없음
  walking:    2
  running:    2
  cycling:    2
  car:        3
  taxi:       3
  bus:        3
  subway:     3
  train:      4
  highway:    4
  flight:     2

# ── 이동수단 세분화 — vehicle/highway 를 car/bus/subway/train 등으로 재분류 ──
# subway: 시간 갭 + 위치 점프 (지하 GPS 손실)
# train:  지속적 고속 주행 (윈도우 평균속도 기준)
refine:
  enabled: true
  subway_gap_sec: 60        # 이전 포인트와 N초 이상 간격
  subway_jump_m:  300       #   + 위치 점프 N미터 이상 → subway
  train_min_speed: 25       # 윈도우 평균속도 ≥ N m/s → train
  train_window: 5           # 지속성 검사 윈도우 크기
  # 속도 임계값 (m/s, 각 활동의 상한선)
  speed_thresholds:
    stationary: 0.5
    walking:    2.0
    running:    4.5
    cycling:    8.0
    car:        25.0
    highway:    90.0
    # > 90: flight

# ── 이상치 필터 (정지 포인트 GPS 노이즈 제거) ────────────────────────────────
# stationary 활동으로 분류된 포인트 중 주변 trend(선형회귀)에서 벗어난
# 것들을 GPS 오차로 판단해 제거. 도보 동선이 깔끔해짐.
outlier:
  enabled: true
  window_size: 10           # 양쪽 이웃 N개로 선형회귀
  max_deviation_m: 200.0    # 예측 위치에서 N미터 이상 벗어나면 outlier

# ── 아이콘 (이동수단 시각화) ──────────────────────────────────────────────────
# head 위치(현재 이동 지점)에 활동별 PNG 아이콘 표시.
# icon/ 폴더에 9개 아이콘: airplane, bicycle, bus, car, running, subway, taxi, train, walking
icon:
  dir:    "icon"      # 아이콘 PNG 폴더
  size:   64          # 아이콘 최대 변 크기 (px)
  alpha:  255         # 0=완전 투명, 255=불투명
  rotate: false       # true 시 진행 방향(bearing)으로 아이콘 회전
                      # 단, 아이콘이 위쪽을 향하도록 디자인된 경우만 자연스러움
  mapping:
    stationary: walking
    walking:    walking
    running:    running
    cycling:    bicycle
    car:        car
    taxi:       taxi
    bus:        bus
    subway:     subway
    train:      train
    highway:    car          # 고속도로 차량 (train 으로 변경 가능)
    flight:     airplane
    unknown:    walking
    vehicle:    car          # 하위 호환

# ── HUD (날짜/시각 + 진행 바) ─────────────────────────────────────────────────
hud:
  enabled:       true    # false 로 설정하면 HUD 전체 숨김
  banner_height: 38      # 상단 배너 높이 (px)
  banner_alpha:  150     # 배너 배경 투명도 (0~255)
  font_size:     20      # 텍스트 크기 (pt)
  font_path:     ""      # 폰트 파일 절대 경로 (비우면 arial.ttf 또는 기본 폰트)

  progress_bar:
    enabled:       true
    color:         [99, 202, 255]    # 진행 바 채움 색 (RGB)
    alpha:         200
    outline_color: [180, 180, 180]   # 진행 바 테두리 색
    outline_alpha: 180
    margin_right:  12    # 오른쪽 여백 (px)
    width:         200   # 진행 바 총 너비 (px)
    height:        16    # 진행 바 높이 (px)
    top_offset:    11    # 배너 상단으로부터 Y 오프셋 (px)

# ── 렌더링 기본값 ─────────────────────────────────────────────────────────────
render:
  duration_sec: 60   # 기본 출력 영상 길이 (초) — CLI --duration 으로 덮어씀
  fps:          30   # 기본 프레임 레이트 — CLI --fps 로 덮어씀
  db_path:      "db/timeline.db"   # SQLite DB 경로
  output_root:  "output"        # PNG 시퀀스 출력 루트 폴더
